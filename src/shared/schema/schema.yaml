openapi: 3.0.0
paths:
  /auth/login:
    post:
      description: >-
        Authenticates users (SUPER_ADMIN, ADMIN, VETERINARIAN, FARMER) with
        username and password. Returns JWT access and refresh tokens.
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEntity'
        '401':
          description: Invalid credentials or account disabled
      summary: User login
      tags:
        - auth
  /auth/refresh:
    post:
      description: >-
        Validates refresh token from Authorization header and issues new access
        and refresh tokens with token rotation. Old refresh token is
        automatically replaced. Send refresh token as Bearer token in
        Authorization header.
      operationId: AuthController_refresh
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: >-
            Successfully refreshed tokens. New tokens issued, old token
            replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEntity'
        '401':
          description: Invalid, expired, or revoked refresh token
      security:
        - bearer: []
      summary: Refresh access token
      tags:
        - auth
  /auth/logout:
    post:
      description: >-
        Revokes the current refresh token. Send refresh token as Bearer token in
        Authorization header.
      operationId: AuthController_logout
      parameters:
        - name: authorization
          required: true
          in: header
          schema:
            type: string
      responses:
        '200':
          description: Successfully logged out
      security:
        - bearer: []
      summary: Logout (revoke current refresh token)
      tags:
        - auth
  /auth/logout-all:
    post:
      description: >-
        Revokes all refresh tokens for the authenticated user. This logs out the
        user from all devices. Requires valid access token.
      operationId: AuthController_logoutAll
      parameters: []
      responses:
        '200':
          description: Successfully logged out from all devices
        '401':
          description: Invalid or expired access token
      security:
        - bearer: []
      summary: Logout from all devices
      tags:
        - auth
  /users:
    post:
      description: Creates a new staff user account (ADMIN role). Admin only.
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserEntity'
        '400':
          description: Invalid data or username already exists
        '403':
          description: Admin access required
      security:
        - bearer: []
      summary: Create staff user
      tags:
        - users
    get:
      description: Retrieve paginated list of all users with optional filters. Admin only.
      operationId: UsersController_findAll
      parameters:
        - name: search
          required: false
          in: query
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            type: number
        - name: perPage
          required: false
          in: query
          schema:
            type: number
        - name: byId
          required: false
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: role
          required: false
          in: query
          description: Filter by user role (e.g., ADMIN, USER)
          schema:
            type: string
            enum:
              - SUPER_ADMIN
              - ADMIN
              - VETERINARIAN
              - FARMER
        - name: createdDate
          required: false
          in: query
          description: Filter by user creation date in ISO format
          schema:
            format: date-time
            example: '2024-01-01T00:00:00.000Z'
            type: string
        - name: byRole
          required: false
          in: query
          description: Sort by role (ASC or DESC)
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: byCreatedDate
          required: false
          in: query
          description: Sort by creation date (ASC or DESC)
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsersEntity'
        '403':
          description: Admin access required
      security:
        - bearer: []
      summary: List all users
      tags:
        - users
