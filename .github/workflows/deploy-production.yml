name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # doossee/vet-diagnostics-frontend

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=prod-

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Next.js bakes these at BUILD time (rewrites + NEXT_PUBLIC_*).
          build-args: |
            BASE_URL=${{ vars.BASE_URL || 'http://backend:3000' }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL || 'https://api.vet-diagnostics.uz' }}

  trigger-deploy:
    name: Trigger deploy on ops repo
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Dispatch deploy-frontend to vet-diagnostics-deploy
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/doossee/vet-diagnostics-deploy/dispatches \
            -d "{\"event_type\":\"deploy-frontend\",\"client_payload\":{\"sha\":\"${{ github.sha }}\"}}"
          echo "Triggered frontend deploy on the ops repo."
