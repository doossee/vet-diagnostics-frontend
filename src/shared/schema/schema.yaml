  /anomaly-detection/predict:
    post:
      description: >-
        Sends 85 features to the ML model for one of 4 cattle types. Returns
        disease predictions (116 possible diseases), detected anomalies, and
        overall severity. Automatically creates alert records if animalId and
        sessionId are provided.
      operationId: AnomalyDetectionController_predict
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictDto'
      responses:
        '201':
          description: Prediction and anomaly detection completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResultEntity'
        '400':
          description: ML service error or invalid data
        '401':
          description: 'Access denied: User is not authenticated. Please log in to continue.'
      summary: Run AI prediction with anomaly detection
      tags:
        - anomaly-detection
  /anomaly-detection/trends:
    get:
      description: >-
        Returns historical values of a specific parameter (e.g. hemoglobin,
        glucose) for an animal over time. Calculates trend direction
        (stable/increasing/decreasing) and percentage change.
      operationId: AnomalyDetectionController_getTrend
      parameters:
        - name: animalId
          required: true
          in: query
          description: Animal UUID to track trends for
          schema:
            type: string
        - name: parameter
          required: true
          in: query
          description: Parameter name to track (e.g. "pulse", "hemoglobin", "glucose")
          schema:
            type: string
        - name: from
          required: false
          in: query
          description: Start date (ISO 8601)
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: End date (ISO 8601)
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Max number of data points to return (default 20)
          schema:
            type: number
      responses:
        '200':
          description: Trend data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendEntity'
        '400':
          description: Unknown parameter name
        '401':
          description: 'Access denied: User is not authenticated. Please log in to continue.'
      summary: Get parameter trend for an animal
      tags:
        - anomaly-detection
  /anomaly-detection/alerts:
    get:
      description: >-
        Paginated list of anomaly alerts with optional filters by animal,
        session, severity, and status.
      operationId: AnomalyDetectionController_getAlerts
      parameters:
        - name: search
          required: false
          in: query
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            type: number
        - name: perPage
          required: false
          in: query
          schema:
            type: number
        - name: byId
          required: false
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: animalId
          required: false
          in: query
          description: Filter by animal ID
          schema:
            type: string
        - name: sessionId
          required: false
          in: query
          description: Filter by session ID
          schema:
            type: string
        - name: severity
          required: false
          in: query
          description: Filter by severity
          schema:
            type: string
            enum:
              - LOW
              - MEDIUM
